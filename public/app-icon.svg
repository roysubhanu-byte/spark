<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background: warm cream gradient matching brand -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F1B16"/>
      <stop offset="100%" stop-color="#2A2520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C99A4B"/>
      <stop offset="100%" stop-color="#E8B85E"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C99A4B"/>
      <stop offset="50%" stop-color="#B8873F"/>
      <stop offset="100%" stop-color="#A07535"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#EDE5D8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Stacked cards (representing swipe deck) -->
  <!-- Back card -->
  <rect x="280" y="200" width="464" height="580" rx="40" fill="#3A3530" opacity="0.6" transform="rotate(-6, 512, 490)"/>

  <!-- Middle card -->
  <rect x="280" y="200" width="464" height="580" rx="40" fill="#4A4540" opacity="0.8" transform="rotate(3, 512, 490)"/>

  <!-- Front card -->
  <rect x="280" y="200" width="464" height="580" rx="40" fill="url(#card2)" transform="rotate(-1, 512, 490)"/>

  <!-- Card content: spark symbol -->
  <g transform="translate(512, 440) rotate(-1)">
    <!-- Spark / lightning bolt -->
    <path d="M-20,-120 L30,-20 L-10,-20 L20,120 L-30,20 L10,20 Z"
          fill="url(#accent)" opacity="0.9"/>
  </g>

  <!-- Card bottom text area -->
  <g transform="translate(512, 620) rotate(-1)">
    <rect x="-160" y="0" width="320" height="6" rx="3" fill="#C99A4B" opacity="0.7"/>
    <rect x="-120" y="20" width="240" height="4" rx="2" fill="#1F1B16" opacity="0.15"/>
    <rect x="-100" y="36" width="200" height="4" rx="2" fill="#1F1B16" opacity="0.1"/>
  </g>

  <!-- "SPARK" text at bottom -->
  <text x="512" y="880" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="300" font-style="italic" fill="url(#accent)" letter-spacing="12">
    SPARK
  </text>
</svg>
